*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font:13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit}body{background:#0b1020;color:#fff}.os{position:fixed;inset:0;background:radial-gradient(circle at 20% 20%,#5c82ff55,transparent 28%),radial-gradient(circle at 80% 25%,#b76cff40,transparent 25%),linear-gradient(135deg,#09111f,#294e7f 50%,#111827)}.top{position:absolute;z-index:1000;top:0;left:0;right:0;height:34px;background:#ffffffdd;color:#111;display:flex;align-items:center;padding:0 8px;gap:2px;backdrop-filter:blur(18px)}.dark .top{background:#181b20e8;color:#eee}.menu{padding:6px 9px;border-radius:7px;cursor:pointer}.menu:hover{background:#0001}.spacer{flex:1}.desktop{position:absolute;inset:34px 0 0}.d{position:absolute;width:105px;text-align:center;color:#fff;text-shadow:0 2px 5px #000;padding:7px;border-radius:10px;cursor:pointer}.d:hover{background:#ffffff25}.d i{display:block;font-style:normal;font-size:40px}.d span{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.dock{position:absolute;z-index:900;bottom:10px;left:50%;transform:translateX(-50%);display:flex;gap:7px;padding:8px 10px;border:1px solid #fff4;border-radius:22px;background:#ffffff32;backdrop-filter:blur(20px)}.dock button{width:48px;height:48px;border:0;border-radius:14px;background:#fff2;color:#fff;font-size:25px;cursor:pointer}.dock button:hover{transform:translateY(-4px)}.boot{position:absolute;z-index:9999;inset:0;background:#050608;display:grid;place-content:center;justify-items:center;gap:13px;transition:.5s}.boot.off{opacity:0;pointer-events:none}.pear{width:72px;height:90px;position:relative}.pear:before{content:"";position:absolute;left:10px;top:18px;width:54px;height:68px;background:linear-gradient(145deg,#b7ef75,#43984e);border-radius:52% 48% 46% 54%;transform:rotate(-12deg)}.pear:after{content:"";position:absolute;left:46px;top:4px;width:27px;height:13px;background:#6c9f4d;border-radius:1 tems:center;gap:8px;padding:7px;border-top:1px solid #0001}.pager button{border:0;background:#0001;color:inherit;border-radius:7px;padding:5px 10px}.status{height:24px;padding:5px 9px;border-top:1px solid #0001;font-size:11px;opacity:.6}.viewer{height:100%;overflow:auto;padding:22px;white-space:pre-wrap;font:13px/1.6 ui-monospace,monospace}.info{padding:20px}.kv{display:grid;grid-template-columns:120px 1fr;gap:9px}.kv b{opacity:.55}
.browser{height:100%;display:flex;flex-direction:column}.tabs{height:38px;display:flex;align-items:end;gap:4px;padding:5px 6px 0;background:#dfe3e9aa}.dark .tabs{background:#14171dcc}.tab{height:32px;min-width:130px;max-width:220px;display:flex;gap:6px;align-items:center;padding:7px 9px;background:#0001;border-radius:8px 8px 0 0;cursor:pointer}.tab.on{background:#fff}.dark .tab.on{background:#232832}.tab em{font-style:normal;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}.bbar{display:flex;gap:5px;padding:7px;border-bottom:1px solid #0001}.bbar button{border:0;background:transparent;color:inherit;border-radius:7px;padding:6px 8px}.addr{flex:1;border:0;outline:0;padding:8px 11px;border-radius:9px;background:#0000000b;color:inherit}.page{flex:1;overflow:auto}.site{max-width:980px;margin:auto;padding:30px}.hero{font-size:40px;font-weight:800;margin-bottom:12px}.sc{padding:16px;border:1px solid #0002;border-radius:14px;margin:12px 0;background:#fff2}.dark .sc{background:#fff1}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.bc{padding:15px;border:1px solid #0002;border-radius:14px;background:#00000008;cursor:pointer}.bc:hover{background:#4b82ff18}.tiny{font-size:11px;opacity:.6}.result{padding:12px 2px;border-bottom:1px solid #0001;cursor:pointer}.shade{position:absolute;z-index:6000;inset:0;background:#0005;display:grid;place-content:center}.dialog{width:430px;background:#f5f6f8;color:#182033;border-radius:13px;overflow:hidden}.dark .dialog{background:#20232b;color:#eef}.db{padding:20px}.db input{width:100%;padding:9px;border:1px solid #0002;border-radius:7px}.actions{display:flex;justify-content:flex-end;gap:8px;padding:10px 15px;border-top:1px solid #0001}.actions button{border:0;border-radius:7px;padding:7px 12px}.primary{background:#3f7fff;color:#fff}.toastbox{position:absolute;z-index:7000;right:18px;bottom:90px;display:flex;flex-direction:column;gap:7px}.toast{background:#171a20e8;color:#fff;padding:10px 14p </style></head><body><div id="os" class="os"><div id="boot" class="boot"><div class="pear"></div><h1>PearOS</h1><div id="bm">Starting PearOS...</div><div class="load"><i></i></div></div><div class="top"><div class="menu" id="p">🍐</div><div class="menu" id="ft">Finder</div><div class="menu" id="bt">PearBrowser</div><div class="menu" id="st">Settings</div><div class="spacer"></div><div id="clock"></div></div><div id="desktop" class="desktop"></div><div class="dock"><button id="fd">🗂️</button><button id="bd">🌐</button><button id="sd">⚙️</button><button id="td">🗑️</button><button id="ad">🍐</button></div><div id="toasts" class="toastbox"></div><input id="imp" class="hidden" type="file" accept="application/json"></div><script>
const KEY='pearos_copy_v1',PAGE=24,icons={folder:'📁',txt:'📄',md:'📝',html:'🌐',css:'🎨',js:'🟨',ts:'🟦',json:'🧩',py:'🐍',java:'☕',cpp:'🔧',h:'🧱',sql:'🗄️',yaml:'🧾',yml:'🧾',csv:'📊',log:'📜',png:'🖼️',jpg:'🖼️',gif:'🖼️',svg:'🖼️',webp:'🖼️',mp3:'🎵',wav:'🔊',mp4:'🎬',mov:'🎬',zip:'🗜️',rar:'🗜️',pdf:'📕',doc:'📘',docx:'📘',pptx:'📙',xlsx:'📊',scratch:'🐱',app:'🧰',unknown:'📄'};
let fs={},trash=[],wins=[],z=20,seq=0,settings={dark:true,wall:0},clipboard={ids:[],cut:false};
const walls=['radial-gradient(circle at 20% 20%,#5c82ff55,transparent 30%),linear-gradient(135deg,#0b1020,#243c6d 55%,#101827)','linear-gradient(135deg,#061b35,#126e9e 48%,#09111e)','radial-gradient(circle at 70% 25%,#a45cff88,transparent 28%),linear-gradient(135deg,#130d27,#070812)'];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const id=()=>`v${++seq}`;
const F=(n,p)=>({id:id(),name:n,type:'folder',parent:p,content:'',size:0,created:'2026-10-01',modified:'2026-10-01'});
const X=(n,p,c='Fictional PearOS file.')=>({id:id(),name:n,type:'file',parent:p,content:c,size:c.length,created:'2026-10-01',modified:'2026-10-01'});
const ext=n=>(n.split('.').pop()||'unknown').toLowerCase();
function add(o){fs[o.id]=o;return o.id}
function root(n){return Object.values(fs).find(x=>x.type==='folder'&&!x.parent&&x.name===n)?.id}
function kids(p){return Object.values(fs).filter(x=>x.parent===p&&!trash.includes(x.id))}
function path(p){let a=[];while(p){let o=fs[p];if(!o)break;a.unshift(o.name);p=o.parent}return a}
function build(){
 seq=0;fs={};trash=[];
 let R={};
 ['Desktop','Documents','Downloads','Pictures','Applications','School','Projects','Writing','Media','Archive','Notes'].forEach(n=>R[n]=add(F(n,null)));
 let subs=['Assignments','Resources','Assets','Notes','Drafts','Backups','Screenshots','Ideas','Builds','Research','References'];
 Object.keys(R).forEach(r=>subs.forEach(s=>add(F(s,R[r]))));
 let bases=[];
 for(let i=1;i<=1099;i++)bases.push(add(F(`Folder ${String(i).padStart(4,'0')}`,R[['Desktop','Documents','Projects','School','Writing','Media','Archive','Notes'][i%8]])));
 for(let i=0;i<22;i++)add(F(['Deep Notes','Extra Assets','Old Drafts','Backup Copy'][i%4],bases[i*50]));
 let special={
  Downloads:['PearOS_Installer.zip','Robotics_Resources.pdf','GameAssets.zip','School_Timetable.pdf','Scratch_Backup.sb3','TexturePack.zip','Template.pptx'],
  Pictures:['pearos-wallpaper.png','desktop-shot.png','dino-sketch.png','pizza-character.png','frog-character.png','cat-character.png','robotics-trophy.jpg','animation-frame-001.png','game-logo.svg','funny-meme.jpg'],
  Applications:['PearBrowser.app','PearPaint.app','PearCode.app','PearTunes.app','PearTerminal.app','PearAnimator.app','PearRobotLab.app','PearNotes.app','PearGames.app','PearCalc.app']
 };
 Object.entries(special).forEach(([r,a])=>a.forEach(n=>add(X(n,R[r],`Fictional ${r} item: ${n}`))));
 add(X('secret.doc',R.Archive,'You found secret.doc.\n\nTry searching PearOS for: orchard, night shift, pear three.\n\nNothing dangerous. Just a silly mystery.'));
 let types=['txt','md','html','css','js','ts','json','xml','py','java','cpp','h','sql','yaml','yml','csv','log','png','jpg','gif','svg','webp','mp3','wav','mp4','mov','zip','rar','pdf','doc','docx','pptx','xlsx','scratch'];
 let names=['README','notes','plan','checklist','ideas','draft','design','report','reference','backup','build','test','story','lore','dialogue','map'];
 let places=Object.values(fs).filter(x=>x.type==='folder');
 for(let i=0;i<3205;i++){
   let p=places[i%places.length];
   add(X(`${names[i%names.length]}-${String(i+1).padStart(4,'0')}.${types[i%types.length]}`,p.id,
   `PearOS virtual file #${i+1}.\nCategory: ${names[i%names.length]}.\nThis file is only stored in the simulation.`))
 }
 save()
}
function save(){localStorage.setItem(KEY,JSON.stringify({fs,trash,settings}))}
function load(){
 try{
  let x=JSON.parse(localStorage.getItem(KEY)||'');
  if(x?.fs){fs=x.fs;trash=x.trash||[];settings=x.settings||settings;return}
 }catch(e){}
 build()
}
function ico(o){return o.type==='folder'?icons.folder:(icons[ext(o.name)]||icons.unknown)}
function toast(t){
 let e=document.createElement('div');e.className='toast';e.textContent=t;toasts.appendChild(e);
 setTimeout(()=>e.remove(),2200)
}
function focus(w){w.style.zIndex=++z}
function win(title,w=880,h=600){
 let e=document.createElement('div');e.className='win';
 e.style.width=w+'px';e.style.height=h+'px';
 e.style.left=Math.max(20,(innerWidth-w)/2)+'px';
 e.style.top=Math.max(45,(innerHeight-h)/2)+'px';
 e.innerHTML=`<div class="bar"><div class="lights"><button class="x"></button><button class="m"></button><button class="g"></button></div><div class="wt">${esc(title)}</div></div><div class="body"></div>`;
 os.appendChild(e);wins.push(e);focus(e);
 e.querySelector('.x').onclick=()=>{wins=wins.filter(x=>x!==e);e.remove()};
 e.addEventListener('pointerdown',()=>focus(e));
 drag(e);return e
}
function drag(w){
 let b=w.querySelector('.bar'),sx,sy,l,t,on=false;
 b.onpointerdown=e=>{
  if(e.target.tagName==='BUTTON')return;
  on=true;sx=e.clientX;sy=e.clientY;l=w.offsetLeft;t=w.offsetTop;b.setPointerCapture(e.pointerId)
 };
 b.onpointermove=e=>{
  if(on){
   w.style.left=Math.max(0,Math.min(innerWidth-w.offsetWidth,l+e.clientX-sx))+'px';
   w.style.top=Math.max(34,Math.min(innerHeight-w.offsetHeight,t+e.clientY-sy))+'px'
  }
 };
 b.onpointerup=()=>on=false
}
function finder(name='Desktop'){
 let w=win('Finder');
 w.f={id:root(name)||name,q:'',page:0,sel:new Set(),hist:[],future:[]};
 drawF(w);return w
}
function items(w){
 let f=w.f;
 if(f.q){
  let q=f.q.toLowerCase();
  return Object.values(fs).filter(o=>!trash.includes(o.id)&&(o.name.toLowerCase().includes(q)||(o.content||'').toLowerCase().includes(q)))
 }
 return kids(f.id)
}
function drawF(w){
 let f=w.f,all=items(w);
 let dirs=all.filter(x=>x.type==='folder').sort((a,b)=>a.name.localeCompare(b.name));
 let files=all.filter(x=>x.type==='file').sort((a,b)=>a.name.localeCompare(b.name));
 let pages=Math.max(1,Math.ceil((dirs.length+files.length)/PAGE));
 let flat=[...dirs,...files],shown=flat.slice(f.page*PAGE,f.page*PAGE+PAGE);
 let nav=['Desktop','Documents','Downloads','Pictures','Applications','School','Projects','Writing','Media','Archive','Notes'];
 w.querySelector('.body').innerHTML=`
 <div class="finder">
  <aside class="side">
   <b>FAVORITES</b>
   ${nav.map(n=>`<div class="si ${root(n)===f.id?'on':''}" data-n="${n}">📁 ${n}</div>`).join('')}
   <b>TOOLS</b>
   <div class="si" id="new">＋ New Folder</div>
   <div class="si" id="br">🌐 PearBrowser</div>
   <div class="si" id="se">⚙️ Settings</div>
   <div class="si" id="tr">🗑️ Trash</div>
  </aside>
  <main class="main">
   <div class="tools">
    <button id="up">↑</button><button id="back">←</button><button id="fwd">→</button>
    <button id="cp">Copy</button><button id="pt">Paste</button><button id="del">Trash</button><button id="inf">Info</button>
    <input class="search" placeholder="Search" value="${esc(f.q)}">
   </div>
   <div class="path">${f.q?'Search: '+esc(f.q):path(f.id).map(esc).join(' / ')}</div>
   <div class="area"><div class="grid">
    ${shown.map(o=>`<div class="item ${f.sel.has(o.id)?'sel':''}" data-id="${o.id}">
      <div class="ico">${ico(o)}</div><div class="name">${esc(o.name)}</div>
    </div>`).join('')}
   </div></div>
   <div class="pager">
    <button id="prev" ${f.page?'':'disabled'}>Previous</button>
    <span>${f.page+1}/${pages} · ${flat.length} items</span>
    <button id="next" ${f.page>=pages-1?'disabled':''}>Next</button>
   </div>
   <div class="status">${f.sel.size} selected · ${Object.keys(fs).length.toLocaleString()} virtual entries</div>
  </main>
 </div>`;
 let q=w.querySelector('.search');
 q.oninput=()=>{f.q=q.value;f.page=0;f.sel.clear();drawF(w)};
 q.onkeydown=e=>e.stopPropagation();
 w.querySelector('#prev').onclick=()=>{if(f.page){f.page--;f.sel.clear();drawF(w)}};
 w.querySelector('#next').onclick=()=>{if(f.page<pages-1){f.page++;f.sel.clear();drawF(w)}};
 w.querySelector('#up').onclick=()=>{
  let o=fs[f.id];
  if(o?.parent){f.hist.push(f.id);f.id=o.parent;f.future=[];drawF(w)}
 };
 w.querySelector('#back').onclick=()=>{
  if(f.hist.length){f.future.push(f.id);f.id=f.hist.pop();drawF(w)}
 };
 w.querySelector('#fwd').onclick=()=>{
  if(f.future.length){f.hist.push(f.id);f.id=f.future.pop();drawF(w)}
 };
 w.querySelector('#cp').onclick=()=>copy(w);
 w.querySelector('#pt').onclick=()=>paste(w);
 w.querySelector('#del').onclick=()=>del(w);
 w.querySelector('#inf').onclick=()=>info(w);
 w.querySelector('#new').onclick=()=>newFolder(w);
 w.querySelector('#br').onclick=browser;
 w.querySelector('#se').onclick=settingsWin;
 w.querySelector('#tr').onclick=trashWin;
 w.querySelectorAll('[data-n]').forEach(e=>e.onclick=()=>{
   f.hist.push(f.id);f.id=root(e.dataset.n);f.q='';f.page=0;f.sel.clear();drawF(w)
 });
 w.querySelectorAll('.item').forEach(e=>{
   e.onclick=ev=>{
    let id=e.dataset.id;
    if(ev.metaKey||ev.ctrlKey){
      f.sel.has(id)?f.sel.delete(id):f.sel.add(id)
    }else{
      f.sel.clear();f.sel.add(id)
    }
    e.classList.toggle('sel',f.sel.has(id))
   };
   e.ondblclick=()=>open(w,e.dataset.id)
 })
}
function open(w,id0){
 let o=fs[id0];if(!o)return;
 if(o.type==='folder'){
  w.f.hist.push(w.f.id);w.f.id=o.id;w.f.future=[];w.f.q='';w.f.page=0;w.f.sel.clear();drawF(w)
 }else viewer(o)
}
function viewer(o){
 let w=win(o.name,700,500);
 w.querySelector('.body').innerHTML=`<div class="viewer"><h2>${ico(o)} ${esc(o.name)}</h2>${esc(o.content||'No preview available.')}</div>`
}
function info(w){
 let o=fs[[...w.f.sel][0]];
 if(!o)return toast('Select something first');
 let x=win('Get Info',470,360);
 x.querySelector('.body').innerHTML=`<div class="info"><h2>${ico(o)} ${esc(o.name)}</h2>
 <div class="kv"><b>Kind</b><div>${o.type==='folder'?'Folder':ext(o.name)+' file'}</div>
 <b>Size</b><div>${o.size} bytes</div>
 <b>Location</b><div>${path(o.parent).join(' / ')||'/'}</div>
 <b>Created</b><div>${o.created}</div><b>Modified</b><div>${o.modified}</div></div></div>`
}
function copy(w){clipboard={ids:[...w.f.sel],cut:false};toast(clipboard.ids.length?'Copied':'Nothing selected')}
function paste(w){
 if(!clipboard.ids.length)return toast('Clipboard is empty');
 for(let id0 of clipboard.ids){
  let s=fs[id0];if(!s)continue;
  let n={...s,id:id(),parent:w.f.id,name:s.name};
  if(Object.values(fs).some(x=>x.parent===w.f.id&&x.name===n.name))
   n.name=n.name.replace(/(\.[^.]+)?$/,(m,e)=>' copy'+(e||''));
  fs[n.id]=n
 }
 save();drawF(w);toast('Pasted')
}
function del(w){
 let a=[...w.f.sel];
 if(!a.length)return toast('Select something first');
 a.forEach(id0=>{if(!trash.includes(id0))trash.push(id0)});
 save();w.f.sel.clear();drawF(w);toast('Moved to Trash')
}
function newFolder(w){
 dialog('New Folder','Folder name','Untitled Folder',n=>{
  if(n){add(F(n,w.f.id));save();drawF(w);toast('Created '+n)}
 })
}
function trashWin(){
 let w=win('Trash');
 w.querySelector('.body').innerHTML=`<div class="area"><h2>🗑️ Trash</h2><p>${trash.length} item(s)</p>
 <button id="empty">Empty Trash</button>
 <div class="grid" style="margin-top:15px">${trash.map(id0=>fs[id0]).filter(Boolean).map(o=>`
 <div class="item"><div class="ico">${ico(o)}</div><div class="name">${esc(o.name)}</div></div>`).join('')}</div></div>`;
 w.querySelector('#empty').onclick=()=>{
  if(confirm('Empty Trash permanently?')){
   trash.forEach(id0=>delete fs[id0]);trash=[];save();w.remove();trashWin();toast('Trash emptied')
  }
 }
}
const sites={
'home':`<div class="site"><div class="hero">🍐 PearBrowser</div><p>The internet, but suspiciously pear-shaped.</p>
<div class="sc"><input id="bs" class="addr" placeholder="Search the PearNet..."><button id="bgo">Search</button></div>
<div class="cards">
<div class="bc" data-url="pear://pearpedia">📚 PearPedia<br><span class="tiny">Mostly useful facts.</span></div>
<div class="bc" data-url="pear://peartube">▶️ PearTube<br><span class="tiny">Definitely real videos.</span></div>
<div class="bc" data-url="pear://pearmail">✉️ PearMail<br><span class="tiny">Absolutely no email sent.</span></div>
<div class="bc" data-url="pear://news">📰 PearNews<br><span class="tiny">Breaking fake news.</span></div>
<div class="bc" data-url="pear://weather">☁️ PearWeather<br><span class="tiny">Forecast: pear.</span></div>
<div class="bc" data-url="pear://pearflix">🎬 PearFlix<br><span class="tiny">The folders are watching.</span></div>
</div></div>`,
pearpedia:`<div class="site"><div class="hero">📚 PearPedia</div>
<div class="sc"><b>Why is PearOS called PearOS?</b><p>Because “WatermelonOS” somehow sounded worse.</p></div>
<div class="sc"><b>What is a folder?</b><p>A tiny box where you hide files until you forget where they went.</p></div></div>`,

${['Speedrunning Finder','Ranking Every PearOS Wallpaper','How To Organise 4,000 Files','I Found secret.doc?!','The Last Browser Tab','Folder Chaos Compilation'].map(x=>`<div class="bc"><b>${x}</b><div class="tiny">0 views · uploaded never</div></div>`).join('')}</div></div>`,

<p>Principal Pear: Please stop making folders called FINAL_final_v7.</p>

<div class="result"><b>Student opens 47 browser tabs</b><div class="tiny">Nobody knows why.</div></div>
<div class="result"><b>Folder named “stuff” reaches version 19</b><div class="tiny">Inside: more stuff.</div></div></div>`,
weather:`<div class="site"><div class="hero">☁️ PearWeather</div><div class="sc"><div style="font-size:48px">🍐 22°</div><p>Light folder showers. 80% chance of finding a file.</p></div></div>`,
pearflix:`<div class="site"><div class="hero">🎬 PearFlix</div><div class="cards">
${['The Folder','Attack of the Pop-Up','Pear Trek','Cooking With Errors','Return of the Lost Download','The Last Tab'].map(x=>`<div class="bc"><b>${x}</b><p class="tiny">Runtime: 42 minutes</p><button onclick="alert('Playback failed because this website is fake.')">Play</button></div>`).join('')}</div></div>`
};
function browser(){
 let w=win('PearBrowser',1000,650);
 w.b={tabs:[{u:'pear://home',t:'New Tab',h:['pear://home'],p:0}],a:0};
 drawB(w);return w
}
function drawB(w){
 let b=w.b,t=b.tabs[b.a];
 w.querySelector('.body').innerHTML=`<div class="browser">
 <div class="tabs">${b.tabs.map((x,i)=>`<div class="tab ${i===b.a?'on':''}" data-tab="${i}">🌐<em>${esc(x.t)}</em><span data-close="${i}">×</span></div>`).join('')}<div class="tab" id="new" style="min-width:42px">＋</div></div>
 <div class="bbar"><button id="prev">←</button><button id="next">→</button><button id="reload">↻</button><button id="home">⌂</button>
 <input id="addr" class="addr" value="${esc(t.u)}"><button id="go">Go</button></div>
 <div class="page" id="page"></div></div>`;
 renderB(w.querySelector('#page'),t.u);
 w.querySelectorAll('[data-tab]').forEach(e=>e.onclick=()=>{b.a=+e.dataset.tab;drawB(w)});
 w.querySelectorAll('[data-close]').forEach(e=>e.onclick=ev=>{
  ev.stopPropagation();let i=+e.dataset.close;
  if(b.tabs.length>1){b.tabs.splice(i,1);b.a=Math.max(0,Math.min(b.a,b.tabs.length-1));drawB(w)}
 });
 w.querySelector('#new').onclick=()=>{
  b.tabs.splice(b.a+1,0,{u:'pear://home',t:'New Tab',h:['pear://home'],p:0});b.a++;drawB(w)
 };
 w.querySelector('#go').onclick=()=>goB(w,w.querySelector('#addr').value);
 w.querySelector('#addr').onkeydown=e=>{if(e.key==='Enter')goB(w,e.target.value)};
 w.querySelector('#prev').onclick=()=>{if(t.p){t.p--;t.u=t.h[t.p];drawB(w)}};
 w.querySelector('#next').onclick=()=>{if(t.p<t.h.length-1){t.p++;t.u=t.h[t.p];drawB(w)}};
 w.querySelector('#reload').onclick=()=>drawB(w);
 w.querySelector('#home').onclick=()=>goB(w,'pear://home')
}
function goB(w,u){
 u=u.trim();
 if(!u.startsWith('pear://'))u='pear://search?q='+encodeURIComponent(u);
 let b=w.b,t=b.tabs[b.a];
 t.h=t.h.slice(0,t.p+1);t.h.push(u);t.p++;t.u=u;
 let key=u.replace(/^pear:\/\//,'').split('?')[0];
 t.t=sites[key]?({home:'New Tab',pearpedia:'PearPedia',peartube:'PearTube',pearmail:'PearMail',news:'PearNews',weather:'PearWeather',pearflix:'PearFlix'}[key]||'PearBrowser'):'Search';
 drawB(w)
}
function renderB(el,u){
 if(u.startsWith('pear://search')){
  let q=decodeURIComponent((u.split('q=')[1]||''));
  let hits=Object.keys(sites).filter(k=>k.includes(q.toLowerCase())||sites[k].toLowerCase().includes(q.toLowerCase()));
  el.innerHTML=`<div class="site"><div class="hero">🔎 PearSearch</div><p>Results for <b>${esc(q)}</b></p>
  ${hits.map(k=>`<div class="result" data-url="pear://${k}"><b>${esc(k)}</b></div>`).join('')||'<div class="sc">No results. The fake internet is tiny.</div>'}</div>`
 }else{
  let key=u.replace(/^pear:\/\//,'').split('?')[0];
  el.innerHTML=sites[key]||sites.home
 }
 el.querySelectorAll('[data-url]').forEach(e=>e.onclick=()=>{
  let w=wins[wins.length-1];
  if(w?.b)goB(w,e.dataset.url)
 });
 let s=el.querySelector('#bs');
 if(s)el.querySelector('#bgo').onclick=()=>{
  let w=wins[wins.length-1];
  goB(w,'pear://search?q='+encodeURIComponent(s.value))
 }
}
function settingsWin(){
 let w=win('Settings',680,520);
 w.querySelector('.body').innerHTML=`<div class="info"><h2>⚙️ PearOS Settings</h2>
 <p><button id="theme">Toggle Light / Dark</button></p>
 <h3>Wallpaper</h3><div>${walls.map((x,i)=>`<button data-w="${i}" style="width:100px;height:55px;background:${x};border:0;border-radius:8px;margin:4px"></button>`).join('')}</div>
 <h3>System</h3><p>${Object.keys(fs).length.toLocaleString()} virtual entries</p>
 <button id="reset">Reset PearOS</button>
 <button id="export">Export</button>
 <button id="import">Import</button>
 <h3>About</h3><p>This is a fictional OS simulation. It does not touch real files.</p></div>`;
 w.querySelector('#theme').onclick=()=>{settings.dark=!settings.dark;apply();save()};
 w.querySelectorAll('[data-w]').forEach(e=>e.onclick=()=>{settings.wall=+e.dataset.w;apply();save()});
 w.querySelector('#reset').onclick=()=>{
  if(confirm('Reset PearOS?')){build();apply();toast('PearOS reset')}
 };
 w.querySelector('#export').onclick=()=>{
  let a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify({fs,trash,settings})],{type:'application/json'}));
  a.download='pearos-backup.json';a.click()
 };
 w.querySelector('#import').onclick=()=>imp.click()
}
function dialog(title,label,value,cb){
 let s=document.createElement('div');s.className='shade';
 s.innerHTML=`<div class="dialog"><div style="padding:15px;border-bottom:1px solid #0001;font-weight:650">${title}</div>
 <div class="db"><div>${label}</div><input id="dv" value="${esc(value)}"></div>
 <div class="actions"><button id="ca">Cancel</button><button id="ok" class="primary">OK</button></div></div>`;
 os.appendChild(s);s.querySelector('#dv').focus();s.querySelector('#dv').select();
 s.querySelector('#ca').onclick=()=>s.remove();
 s.querySelector('#ok').onclick=()=>{cb(s.querySelector('#dv').value.trim());s.remove()}
}
function apply(){document.body.classList.toggle('dark',settings.dark);os.style.background=walls[settings.wall%walls.length]}
function about(){
 let s=document.createElement('div');s.className='shade';
 s.innerHTML=`<div class="dialog"><div style="padding:15px;border-bottom:1px solid #0001;font-weight:650">About PearOS</div>
 <div class="db"><h2>🍐 PearOS</h2><p>A completely fake browser-based computer.</p><p>Single HTML file. GitHub Pages friendly.</p><p>Nothing here accesses your real files.</p></div>
 <div class="actions"><button id="closeAbout" class="primary">Close</button></div></div>`;
 os.appendChild(s);s.querySelector('#closeAbout').onclick=()=>s.remove()
}
function desktop(){
 let a=[['Desktop','🖥️'],['Documents','📁'],['Downloads','⬇️'],['Pictures','🖼️'],['Applications','🧰'],['School','📚'],['Projects','🛠️'],['Trash','🗑️']];
 desktopEl.innerHTML=a.map((x,i)=>`<div class="d" style="left:${20+(i%4)*118}px;top:${25+~~(i/4)*108}px" data-n="${x[0]}"><i>${x[1]}</i><span>${x[0]}</span></div>`).join('');
 desktopEl.querySelectorAll('.d').forEach(e=>e.onclick=()=>e.dataset.n==='Trash'?trashWin():finder(e.dataset.n))
}
function keys(e){
 let w=wins.at(-1);
 if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='a'&&w?.f&&!document.activeElement.matches('input')){
  e.preventDefault();items(w).forEach(o=>w.f.sel.add(o.id));drawF(w)
 }
 if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='f'&&w?.f){
  e.preventDefault();w.querySelector('.search').focus()
 }
 if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='c'&&w?.f){e.preventDefault();copy(w)}
 if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='v'&&w?.f){e.preventDefault();paste(w)}
 if((e.key==='Delete'||e.key==='Backspace')&&w?.f&&!document.activeElement.matches('input')){e.preventDefault();del(w)}
 if(e.key==='Escape')document.querySelectorAll('.shade').forEach(x=>x.remove())
}
function start(){
 load();apply();desktop();
 ft.onclick=()=>finder();fd.onclick=()=>finder();
 bt.onclick=browser;bd.onclick=browser;
 st.onclick=settingsWin;sd.onclick=settingsWin;
 td.onclick=trashWin;p.onclick=about;ad.onclick=about;
 clock.textContent=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
 setInterval(()=>clock.textContent=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}),30000);
 addEventListener('keydown',keys);
 let msgs=['Starting PearOS...','Indexing 1,100+ folders...','Loading 3,200+ files...','Starting PearBrowser...','Ready!'];
 let i=0,q=setInterval(()=>bm.textContent=msgs[Math.min(++i,msgs.length-1)],390);
 setTimeout(()=>{clearInterval(q);boot.classList.add('off');finder()},2400)
}
start();
</script></body></html>
