item ${f.sel.has(o.id)?'sel':''}" draggable="${o.type==='file'}" data-id="${o.id}"><div class="ico">${ico(o)}</div><div class="name">${esc(o.name)}</div></div>`).join('')}</div></div><div class="pager"><button id="prev" ${f.page?'':'disabled'}>Previous</button><span>${f.page+1}/${pages} · ${flat.length} items</span><button id="next" ${f.page>=pages-1?'disabled':''}>Next</button></div><div class="status">${f.sel.size} selected · ${Object.keys(fs).length.toLocaleString()} virtual entries</div></main></div>`;let q=w.querySelector('.search');q.oninput=()=>{f.q=q.value;f.page=0;f.sel.clear();drawF(w)};q.onkeydown=e=>e.stopPropagation();w.querySelector('#prev').onclick=()=>{if(f.page){f.page--;f.sel.clear();drawF(w)}};w.querySelector('#next').onclick=()=>{if(f.page<pages-1){f.page++;f.sel.clear();drawF(w)}};w.querySelector('#up').onclick=()=>{let o=fs[f.id];if(o?.parent){f.hist.push(f.id);f.id=o.parent;f.future=[];drawF(w)}};w.querySelector('#back').onclick=()=>{if(f.hist.length){f.future.push(f.id);f.id=f.hist.pop();drawF(w)}};w.querySelector('#fwd').onclick=()=>{if(f.future.length){f.hist.push(f.id);f.id=f.future.pop();drawF(w)}};w.querySelector('#cp').onclick=()=>copy(w);w.querySelector('#pt').onclick=()=>paste(w);w.querySelector('#del').onclick=()=>del(w);w.querySelector('#inf').onclick=()=>info(w);w.querySelector('#new').onclick=()=>newFolder(w);w.querySelector('#br').onclick=browser;w.querySelector('#se').onclick=settingsWin;w.querySelector('#tr').onclick=trashWin;w.querySelector('#usb').onclick=usbWin;const usbZone=w.querySelector('#usb');usbZone.addEventListener('dragover',e=>{e.preventDefault();usbZone.classList.add('on')});usbZone.addEventListener('dragleave',()=>usbZone.classList.remove('on'));usbZone.addEventListener('drop',e=>{e.preventDefault();usbZone.classList.remove('on');dropFilesToUsb(e)});w.querySelectorAll('[data-n]').forEach(e=>e.onclick=()=>{let target=root(e.dataset.n);if(e.dataset.n==='00 - Mystery Files')target=Object.values(fs).find(o=>o.type=== function dropFilesToUsb(e){
  try{
    let ids=JSON.parse(e.dataTransfer.getData('application/x-pear-files')||'[]');
    if(!ids.length){toast('Nothing to copy');return}
    const secret=ids.map(id0=>fs[id0]).find(o=>o&&o.type==='file'&&o.name==='secret.doc');
    if(secret){
      if(usbItems().some(x=>x.name===secret.name)){toast('secret.doc is already on stealer300');return}
      transferSecretToUsb(secret);return;
    }
    let added=0;
    ids.forEach(id0=>{
      let o=fs[id0];
      if(o&&o.type==='file'&&!usbItems().some(x=>x.name===o.name)){cloneToUsb(o);added++}
    });
    save();
    toast(added?`🔌 Copied ${added} file${added===1?'':'s'} to stealer300`:'No new files copied');
  }catch(err){toast('USB drop failed')}
}
function transferSecretToUsb(secret){
  const existing=document.getElementById('transferShade');
  if(existing) existing.remove();

  const canComplete=!!usb.secretTransferUnlocked;
  const shade=document.createElement('div');
  shade.id='transferShade';
  shade.className='transferShade';
  shade.innerHTML=`<div class="transferCard">
    <div class="transferTop">🔌 Copying to stealer300</div>
    <div class="transferBody">
      <div><b>📄 ${esc(secret.name)}</b></div>
      <div style="font-size:12px;opacity:.7;margin-top:4px">Preparing virtual USB transfer...</div>
      <div class="transferBar" style="margin-top:18px"><div class="transferFill" id="transferFill"></div></div>
      <div class="transferPct" id="transferPct">0%</div>
      <div id="transferStatus" style="margin-top:10px;text-align:center">Transferring slowly...</div>
      <div id="transferError"></div>
    </div>
  </div>`;
  os.appendChild(shade);

  const fill=shade.querySelector('#transferFill');
  const pct=shade.querySelector('#transferPct');
  const status=shade.querySelector('#transferStatus');
  const err=shade.querySelector('#transferError');
  let progress=0;
  const target=canComplete?100:50;

  const timer=setInterval(()=>{
    progress += canComplete ? 2.5 : 2.2;

    if(progress>=target){
      progress=target;
      clearInterval(timer);
      fill.style.width=target+'%';
      pct.textContent=target+'%';

      if(canComplete){
        usb.items=usb.items||{};
        if(!usbItems().some(x=>x.name===secret.name)) cloneToUsb(secret);
        usb.secretTransferUnlocked=false;
        save();
        status.textContent='Transfer complete!';
        err.innerHTML=`<div style="margin-top:16px;padding:12px;border-radius:10px;background:#163d22;border:1px solid #5be08a55;color:#d9ffe5"><b>✅ Download complete</b><div style="margin-top:5px">secret.doc was copied successfully to stealer300.</div></div><div class="transferActions"><button class="transferReset" id="transferDone">Done</button></div>`;
        shade.querySelector('#transferDone').onclick=()=>{shade.remove();toast('✅ secret.doc is now on stealer300');try{usbWin()}catch(e){}};
        return;
      }

      status.textContent='Transfer interrupted.';
      err.innerHTML=`<div class="transferError"><b>⚠️ Error: USB transfer stopped</b><div style="margin-top:5px">stealer300 reported an unexpected read/write error while copying <b>secret.doc</b>.</div><div class="transferHint">Reset the USB controller, then try dragging secret.doc again.</div></div><div class="transferActions"><button class="transferCancel" id="transferClose">Cancel</button><button class="transferReset" id="transferReset">🔄 Reset USB Controller</button></div>`;
      shade.querySelector('#transferClose').onclick=()=>shade.remove();
      shade.querySelector('#transferReset').onclick=()=>{
        usb.secretTransferUnlocked=true;
        save();
        shade.remove();
        toast('🔌 USB controller reset. Drag secret.doc again to retry.');
      };
    }else{
      fill.style.width=progress+'%';
      pct.textContent=Math.floor(progress)+'%';
      status.textContent=canComplete?'Transferring...':'Transferring slowly...';
    }
  },300);
}

function settingsWin(){let w=win('Settings',680,520);w.querySelector('.body').innerHTML=`<div class="info"><h2>⚙️ PearOS Settings</h2><p><button id="theme">Toggle Light / Dark</button></p><h3>Wallpaper</h3><div>${walls.map((x,i)=>`<button data-w="${i}" style="width:100px;height:55px;background:${x};border:0;border-radius:8px;margin:4px"></button>`).join('')}</div><h3>System</h3><p>${Object.keys(fs).length.toLocaleString()} virtual entries</p><button id="reset">Reset PearOS</button> <button id="export">Export</button> <button id="import">Import</button><h3>About</h3><p>This is a fictional OS simulation. It does not touch real files.</p></div>`;w.querySelector('#theme').onclick=()=>{settings.dark=!settings.dark;apply();save()};w.querySelectorAll('[data-w]').forEach(e=>e.onclick=()=>{settings.wall=+e.dataset.w;apply();save()});w.querySelector('#reset').onclick=()=>{if(confirm('Reset PearOS?')){build();apply();toast('PearOS reset')}};w.querySelector('#export').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({fs,trash,settings})],{type:'application/json'}));a.download='pearos-backup.json';a.click()};w.querySelector('#import').onclick=()=>imp.click()}function dialog(title,label,value,cb){let s=document.createElement('div');s.className='shade';s.innerHTML=`<div class="dialog"><div style="padding:15px;border-bottom:1px solid #0001;font-weight:650">${title}</div><div class="db"><div>${label}</div><input id="dv" value="${esc(value)}"></div><div class="actions"><button id="ca">Cancel</button><button id="ok" class="primary">OK</button></div></div>`;os.appendChild(s);s.querySelector('#dv').focus();s.querySelector('#dv').select();s.querySelector('#ca').onclick=()=>s.remove();s.querySelector('#ok').onclick=()=>{cb(s.querySelector('#dv').value.trim());s.remove()}}
function apply(){document.body.classList.toggle('dark',settings.dark);os.style.background=walls[settings.wall%walls.length]}function about(){dialog('About PearOS','',``,()=>{}) ;let s=document.querySelector('.shade');s.querySelector('.db').innerHTML='<h2>🍐 PearOS</h2><p>A completely fake browser-based computer.</p><p>Single HTML file. GitHub Pages friendly.</p><p>Nothing here accesses your real files.</p>';s.querySelector('#ok').textContent='Close'}function desktop(){let a=[['Desktop','🖥️'],['Documents','📁'],['Downloads','⬇️'],['Pictures','🖼️'],['Applications','🧰'],['School','📚'],['Projects','🛠️'],['Trash','🗑️'],['stealer300','🔌']];desktopEl.innerHTML=a.map((x,i)=>`<div class="d" style="left:${20+(i%4)*118}px;top:${25+~~(i/4)*108}px" data-n="${x[0]}"><i>${x[1]}</i><span>${x[0]}</span></div>`).join('');desktopEl.querySelectorAll('.d').forEach(e=>{e.onclick=()=>e.dataset.n==='Trash'?trashWin():e.dataset.n==='stealer300'?usbWin():finder(e.dataset.n);e.addEventListener('dragover',ev=>{if(e.dataset.n==='stealer300'){ev.preventDefault();e.style.background='#4b82ff44'}});e.addEventListener('dragleave',()=>{if(e.dataset.n==='stealer300')e.style.background=''});e.addEventListener('drop',ev=>{if(e.dataset.n==='stealer300'){ev.preventDefault();e.style.background='';dropFilesToUsb(ev)}})})}
function keys(e){let w=wins.at(-1);if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='a'&&w?.f&&!document.activeElement.matches('input')){e.preventDefault();items(w).forEach(o=>w.f.sel.add(o.id));drawF(w)}if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='f'&&w?.f){e.preventDefault();w.querySelector('.search').focus()}if(e.key==='Escape')document.querySelectorAll('.shade').forEach(x=>x.remove())}window.addEventListener('error',e=>{const b=document.getElementById('boot');if(b){b.classList.add('off')}let d=document.getElementById('desktop');if(d&&!d.children.length){d.innerHTML='<div style="padding:60px;text-align:center;color:white;font-size:18px;text-shadow:0 2px 8px #000">🍐 PearOS hit a startup error. Refreshing should rebuild the virtual computer.<br><small style="opacity:.7">'+String(e.message||'Unknown error') .replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))+'</small></div>'}});
function showStartupError(err){
  console.error('PearOS startup error:',err);
  const d=document.getElementById('desktop');
  const b=document.getElementById('boot');
  if(b)b.classList.add('off');
  if(d&&!d.children.length){
    d.innerHTML='<div style="padding:70px;text-align:center;color:white;text-shadow:0 2px 10px #000"><div style="font-size:54px">🍐</div><h1>PearOS</h1><p>Something went wrong while starting the simulation.</p><p style="opacity:.7;font-family:monospace">'+esc(err?.message||String(err)||'Unknown error')+'</p><button onclick="location.reload()" style="padding:9px 16px;border:0;border-radius:8px">Restart PearOS</button></div>';
  }
}
window.addEventListener('error',e=>showStartupError(e.error||new Error(e.message||'Unknown error')));
function start(){
  try{
    load();
    apply();
    desktop();
    ft.onclick=()=>finder();
    fd.onclick=()=>finder();
    bt.onclick=browser;
    bd.onclick=browser;
    st.onclick=settingsWin;
    sd.onclick=settingsWin;
    td.onclick=trashWin;
    p.onclick=about;
    ad.onclick=about;
    clock.textContent=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
    setInterval(()=>clock.textContent=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}),30000);
    addEventListener('keydown',keys);
    const msgs=['Starting PearOS...','Indexing folders...','Loading files...','Starting PearBrowser...','Ready!'];
    let i=0;
    const q=setInterval(()=>bm.textContent=msgs[Math.min(++i,msgs.length-1)],390);
    setTimeout(()=>{
      clearInterval(q);
      boot.classList.add('off');
      try{finder()}catch(e){showStartupError(e)}
    },2400);
  }catch(e){
    showStartupError(e);
  }
}
start();</script></body></html>
